# Local-only demo. Do not expose ports or use demo secrets in production.
x-airflow-common: &airflow-common
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: '1'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API__BASE_URL: http://localhost:8080
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-local-demo-api-secret-change-before-sharing-123456789}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-demo-jwt-secret-change-before-sharing-123456789}
    # No UI login for this loopback-bound *local demo* only.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'True'
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    LAKE_BUCKET: ${LAKE_BUCKET:-taxi-datalake}
    START_DATE: ${START_DATE:-2023-01-01}
    END_DATE: ${END_DATE:-2023-01-08}
    PAGE_SIZE: ${PAGE_SIZE:-20000}
    MAX_ROWS: ${MAX_ROWS:-150000}
    MAX_REJECT_RATE: ${MAX_REJECT_RATE:-0.10}
    MAX_DUPLICATE_RATE: ${MAX_DUPLICATE_RATE:-0.10}
    MAX_EXTRACT_AGE_HOURS: ${MAX_EXTRACT_AGE_HOURS:-24}
    MAX_TRIP_MILES: ${MAX_TRIP_MILES:-500}
    MAX_TRIP_DURATION_SECONDS: ${MAX_TRIP_DURATION_SECONDS:-86400}
    MAX_TRIP_TOTAL_USD: ${MAX_TRIP_TOTAL_USD:-5000}
    SODA_APP_TOKEN: ${SODA_APP_TOKEN:-}
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
    SPARK_MASTER: local[2]
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U airflow -d airflow']
      interval: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, 'mc', 'ready', 'local']
      interval: 5s
      retries: 30

  airflow-init:
    <<: *airflow-common
    command: ['airflow', 'db', 'migrate']
    restart: 'no'

  airflow-api-server:
    <<: *airflow-common
    command: ['airflow', 'api-server', '--port', '8080', '--workers', '1']
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://localhost:8080/api/v2/monitor/health > /dev/null']
      interval: 15s
      timeout: 10s
      retries: 20

  airflow-dag-processor:
    <<: *airflow-common
    command: ['airflow', 'dag-processor']
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: ['airflow', 'scheduler']
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
      airflow-dag-processor:
        condition: service_started

  dremio:
    image: dremio/dremio-oss
    ports:
      - '127.0.0.1:9047:9047'
      - '127.0.0.1:31010:31010'
    volumes:
      - dremio_data:/opt/dremio/data
    depends_on:
      minio:
        condition: service_healthy

volumes:
  dremio_data:
  minio_data:
  postgres_data:
  airflow_logs:
